name: Blood lab PDF regression

on:
  push:
    paths:
      - "lib/importers/blood-tests/**"
      - "fixtures/blood-lab-pdfs/**"
      - "lib/ingestion/parsers/blood-lab-pdf.ts"
      - "scripts/doctor-pdf.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/blood-lab-pdf.yml"
  pull_request:
    paths:
      - "lib/importers/blood-tests/**"
      - "fixtures/blood-lab-pdfs/**"
      - "lib/ingestion/parsers/blood-lab-pdf.ts"
      - "scripts/doctor-pdf.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/blood-lab-pdf.yml"

jobs:
  blood-lab-pdf:
    name: Blood lab PDF fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Doctor pdf.js environment
        run: pnpm doctor:pdf

      - name: Run blood lab PDF regression suite
        run: pnpm test:blood-pdf
